<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>
    <script>
        let pesotxt = prompt("Digite seu peso em kg:");
        let alturatxt = prompt("Digite sua altura em metros:");

        let peso = Number(pesotxt);
        let altura = Number(alturatxt);

        let imc = peso / (altura * altura);
        let classificacao = "";

        if(imc <18.5){
            classificacao = "Abaixo do peso";
        } else if(imc < 25){
            classificacao = "Peso normal";
        } else if(imc < 30){
            classificacao = "Sobrepeso";
        } else {
            classificacao = "Obesidade";
        }
        alert("IMC : " +imc+ " - Classificação: " + classificacao);
    </script>
</body>
</html>
